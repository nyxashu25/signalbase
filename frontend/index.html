<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7C00BA" />
    <title>DataPit</title>
    <!--
      Build-time slots filled by scripts/prerender.mjs: the page's SEO head
      (description, canonical, Open Graph, JSON-LD) and its prerendered HTML.
    -->
    <!--app-head-->

    <script>
      // Runs before the stylesheet paints, so an explicit saved preference
      // (see useTheme.js) applies immediately instead of flashing the OS
      // default first. No stored value = follow the OS preference, handled
      // entirely by CSS (index.css), nothing to do here.
      (function () {
        try {
          var stored = localStorage.getItem('dp-theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) {}
      })();
    </script>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicons/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicons/favicon-192x192.png" sizes="192x192" type="image/png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

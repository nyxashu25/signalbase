# nginx site for datapit.io — the copy installed on the VPS at
# /etc/nginx/sites-available/datapit.io (symlinked into sites-enabled).
# Edit here, then copy it over, `nginx -t`, and `systemctl reload nginx`.
#
# The frontend build (frontend/scripts/prerender.mjs) writes one static HTML
# file per public page, so crawlers get the full page without running
# JavaScript:
#   /            -> index.html      /pricing -> pricing.html (etc.)
#   app, admin and auth screens -> app.html (the unprerendered shell, noindex)
#   anything else -> 404.html with a real 404 status

# The `datapit_io` upstream (the API on 127.0.0.1:4000) is declared in
# /etc/nginx/nginx.conf alongside the other sites on this host.

server {
    server_name datapit.io www.datapit.io;
    root /var/www/datapit.io/app/frontend/dist;
    index index.html;

    # One canonical host: www redirects to the bare domain.
    if ($host = www.datapit.io) {
        return 301 https://datapit.io$request_uri;
    }

    location /api {
        proxy_pass http://datapit_io;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Liveness/readiness probes — safe to expose publicly, no internal detail leaked.
    location /health {
        proxy_pass http://datapit_io;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prometheus metrics — internal-scrape-only by design (see RUNBOOK.md /
    # backend/src/routes/metrics.js).
    location /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://datapit_io;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The React app's own routes: the app, the admin panel and the auth
    # screens all boot from the same noindex shell.
    location ~ ^/(app|control|login|verify-email|forgot-password|reset-password|accept-invite|unsubscribe)(/|$) {
        add_header Cache-Control "no-cache";
        try_files /app.html =404;
    }

    # The home page.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # One URL per page: the .html files are an implementation detail.
    location = /index.html {
        return 301 /;
    }
    location ~ ^/(pricing|product|solutions|about|contact|privacy|terms)\.html$ {
        return 301 /$1;
    }

    # Prerendered pages and static files. HTML (and everything small served
    # from here) always revalidates, so a deploy shows up immediately.
    location / {
        rewrite ^/(.+)/$ /$1 permanent;
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/datapit.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/datapit.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    # Plain HTTP: straight to the canonical https host in one hop.
    if ($host = www.datapit.io) {
        return 301 https://datapit.io$request_uri;
    } # managed by Certbot

    if ($host = datapit.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name datapit.io www.datapit.io;

    listen 80;
    return 404; # managed by Certbot
}

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history, not just the current tree
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signalbase
          POSTGRES_PASSWORD: signalbase
          POSTGRES_DB: datapit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signalbase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: '-Xms512m -Xmx512m'
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl --silent --fail localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run format
      # The Prisma CLI reads .env directly (not our app's NODE_ENV-aware
      # loader), so DATABASE_URL is passed explicitly here to match the
      # service container above and backend/.env.test.
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://signalbase:signalbase@localhost:5432/datapit_test
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run format
      - run: npm test

  container-scan:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: false
          load: true
          tags: datapit-${{ matrix.service }}:ci

      - name: Scan ${{ matrix.service }} image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: datapit-${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true # a HIGH/CRITICAL CVE with no available fix yet can't be acted on

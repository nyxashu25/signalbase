<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>DataPit extension options</title>
  <style>
    body {
      max-width: 460px; margin: 40px auto; padding: 0 16px;
      background: #16121f; color: #f4f2f8;
      font: 14px/1.6 -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 { font-size: 16px; }
    label { display: block; margin-top: 16px; font-weight: 600; font-size: 13px; }
    .muted { color: #a49fb3; font-size: 12px; }
    input {
      width: 100%; box-sizing: border-box; margin-top: 6px; padding: 9px 11px;
      border-radius: 8px; border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.06); color: #fff;
      font: 13px ui-monospace, Consolas, monospace;
    }
    button {
      margin-top: 14px; cursor: pointer; border: 0; border-radius: 8px;
      padding: 9px 16px; font-weight: 700; font-size: 13px;
      background: linear-gradient(90deg,#7c3aed,#db2777); color: #fff;
    }
    #saved { margin-left: 10px; color: #34d399; font-size: 13px; }
  </style>
</head>
<body>
  <h1>DataPit extension — options</h1>
  <label for="apiBase">API base URL</label>
  <div class="muted">
    Leave as-is for production. For local development, point it at your dev API
    (e.g. <code>http://localhost:4000/api/v1</code>).
  </div>
  <input id="apiBase" placeholder="https://datapit.io/api/v1" spellcheck="false" />
  <button id="save">Save</button><span id="saved" hidden>Saved ✓</span>
  <script src="options.js"></script>
</body>
</html>

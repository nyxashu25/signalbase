<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>DataPit extension options</title>
  <style>
    :root {
      --cyan:#22d3ee; --cyan-hi:#67e8f9; --mag:#ff2a6d; --violet:#a855f7;
      --ok:#00ffa3;
      --ink:#e8f6ff; --muted:#7f8bb0; --panel:#0a0d18; --line:rgba(34,211,238,.32);
    }
    @keyframes dp-led { 0%,100% { opacity:1; } 50% { opacity:.25; } }
    @keyframes dp-sheen { from { transform:translateX(-120%);} to { transform:translateX(320%);} }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; padding: 56px 20px; color: var(--ink);
      background:
        radial-gradient(60% 50% at 100% 0%, rgba(255,42,109,.10), transparent 55%),
        radial-gradient(60% 50% at 0% 0%, rgba(34,211,238,.12), transparent 55%),
        var(--panel);
      background-attachment: fixed;
      font: 14px/1.6 "Segoe UI", Roboto, -apple-system, sans-serif;
    }
    .shell {
      position: relative; max-width: 480px; margin: 0 auto; padding: 26px 26px 28px;
      background: rgba(34,211,238,.04);
      box-shadow: 0 0 0 1px var(--line) inset, 0 24px 60px rgba(0,0,0,.5);
      clip-path: polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
    }
    .shell::before { content:''; position:absolute; top:0; left:16px; right:0; height:2px;
      background: linear-gradient(90deg,var(--cyan),var(--violet) 55%,var(--mag)); box-shadow:0 0 10px rgba(34,211,238,.7); }
    .shell::after { content:''; position:absolute; inset:0; pointer-events:none; opacity:.4;
      background: repeating-linear-gradient(0deg, rgba(120,220,255,.04) 0 1px, transparent 1px 3px); }

    .head { display:flex; align-items:center; gap:10px; }
    .led { width:9px; height:9px; border-radius:50%; background:var(--ok);
      box-shadow:0 0 10px var(--ok); animation: dp-led 1.8s ease-in-out infinite; flex:none; }
    h1 { margin:0; font: 800 16px/1 ui-monospace, "Cascadia Code", Consolas, monospace;
      letter-spacing:.22em; text-transform:uppercase;
      background: linear-gradient(90deg,var(--cyan),var(--mag));
      -webkit-background-clip:text; background-clip:text; color:transparent; }
    .head .tag { margin-left:auto; font:700 10px/1 ui-monospace,Consolas,monospace; letter-spacing:.16em;
      text-transform:uppercase; color:var(--muted); padding:3px 8px; border:1px solid rgba(127,139,176,.3); border-radius:3px; }
    .lede { margin-top:6px; font:11px/1.5 ui-monospace,Consolas,monospace; letter-spacing:.08em;
      text-transform:uppercase; color:var(--muted); }

    label { display:block; margin-top: 24px; font:700 11px/1 ui-monospace,Consolas,monospace;
      letter-spacing:.14em; text-transform:uppercase; color: var(--cyan-hi); }
    .muted { color: var(--muted); font-size: 12px; margin-top:6px; }
    code { font-family: ui-monospace, Consolas, monospace; color: var(--cyan-hi);
      background: rgba(34,211,238,.08); padding: 1px 5px; border-radius: 3px; }
    input {
      width: 100%; margin-top: 9px; padding: 10px 12px; border-radius: 5px;
      border: 1px solid var(--line); border-left:2px solid var(--cyan);
      background: rgba(34,211,238,.05); color: var(--cyan-hi);
      font: 13px ui-monospace, "Cascadia Code", Consolas, monospace;
    }
    input::placeholder { color: rgba(127,139,176,.7); }
    input:focus { outline: none; border-color: var(--cyan);
      box-shadow: 0 0 0 1px var(--cyan), 0 0 14px rgba(34,211,238,.35); }
    button {
      position:relative; overflow:hidden; margin-top: 20px; cursor: pointer; border: 0;
      padding: 10px 20px; font: 800 12px/1 ui-monospace, Consolas, monospace;
      letter-spacing:.12em; text-transform:uppercase; color:#04121a;
      background: linear-gradient(120deg,var(--cyan),var(--cyan-hi));
      clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
      box-shadow: 0 0 16px rgba(34,211,238,.35); transition: box-shadow .18s ease, transform .1s ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 0 24px rgba(34,211,238,.6); }
    button::after { content:''; position:absolute; top:0; left:0; width:40%; height:100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
      transform: translateX(-120%); animation: dp-sheen 3.4s ease-in-out infinite; }
    #saved { margin-left: 12px; color: var(--ok); font: 13px ui-monospace,Consolas,monospace;
      text-shadow: 0 0 10px rgba(0,255,163,.4); }
  </style>
</head>
<body>
  <div class="shell">
    <div class="head">
      <span class="led"></span>
      <h1>DataPit</h1>
      <span class="tag">Options</span>
    </div>
    <div class="lede">Extension configuration</div>

    <label for="apiBase">API base URL</label>
    <div class="muted">
      Leave as-is for production. For local development, point it at your dev API
      (e.g. <code>http://localhost:4000/api/v1</code>).
    </div>
    <input id="apiBase" placeholder="https://datapit.io/api/v1" spellcheck="false" />
    <div>
      <button id="save">Save</button><span id="saved" hidden>Saved ✓</span>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
